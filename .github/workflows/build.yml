name: Build firmware

on:
  workflow_dispatch:
    inputs:
      config:
        description: "configs/ 底下的設定檔名"
        default: ax6.config
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4

      - name: Feeds
        run: |
          ./scripts/feeds update -a
          sh scripts/apply-feeds-patches.sh
          sh scripts/fix-feeds-apk-version.sh
          ./scripts/feeds install -a

      - name: Config
        run: |
          cp "configs/${{ inputs.config }}" .config
          make defconfig
          ./scripts/diffconfig.sh > /tmp/effective.diffconfig
          diff "configs/${{ inputs.config }}" /tmp/effective.diffconfig || echo "::warning::defconfig 改動了設定，見上方 diff"

      - name: Download sources
        run: make download -j8

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.config }}-${{ github.run_number }}
          path: |
            bin/targets/*/*/*
            !bin/targets/*/*/packages
